# Release: a GitHub release from the client module's changelog for each pushed client tag.
# See architecture/standards/go-elemental/principles/release-and-ci.md
name: Release

on:
  push:
    tags:
      - 'client/v*'

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: taiki-e/create-gh-release-action@v1.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          changelog: client/CHANGELOG.md
          prefix: client/
